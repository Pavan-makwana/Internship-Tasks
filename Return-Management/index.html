<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>E-commerce Return System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card shadow">
        <div class="card-header text-center fw-bold">
          Return Request Form
        </div>

        <div class="card-body">
          <form id="returnForm">

            <div class="mb-3">
              <label class="form-label">Return ID</label>
              <input type="text" id="returnId" class="form-control" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Product Category</label>
              <select id="category" class="form-select" required>
                <option value="">Select Category</option>
                <option>Electronics</option>
                <option>Clothing</option>
                <option>Accessories</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Return Reason</label>
              <textarea id="reason" class="form-control" rows="3" required></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label">Order Date</label>
              <input type="date" id="orderDate" class="form-control" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Return Date</label>
              <input type="date" id="returnDate" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
              Submit Return Request
            </button>
          </form>

          <div id="message" class="mt-3 text-center fw-bold"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  // Local array to store return requests (JSON format)
  const returnRequests = [];

  document.getElementById("returnForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const orderDate = new Date(document.getElementById("orderDate").value);
    const returnDate = new Date(document.getElementById("returnDate").value);

    const diffDays = Math.ceil(
      (returnDate - orderDate) / (1000 * 60 * 60 * 24)
    );

    const messageDiv = document.getElementById("message");

    if (diffDays > 7) {
      messageDiv.textContent = "Error: Return period expired.";
      messageDiv.className = "text-danger fw-bold";
      return;
    }

    const returnData = {
      return_id: document.getElementById("returnId").value,
      product_category: document.getElementById("category").value,
      return_reason: document.getElementById("reason").value,
      order_date: document.getElementById("orderDate").value,
      return_date: document.getElementById("returnDate").value
    };

    returnRequests.push(returnData);

    messageDiv.textContent = "Return Request Submitted Successfully.";
    messageDiv.className = "text-success fw-bold";

    console.log("Stored Return Requests:", JSON.stringify(returnRequests, null, 2));

    document.getElementById("returnForm").reset();
  });
</script>

</body>
</html>
