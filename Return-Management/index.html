<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Return Request</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card mt-5 shadow">
        <div class="card-header text-center fw-bold">
          Product Return Request
        </div>

        <div class="card-body">
          <form id="returnForm">

            <input class="form-control mb-2" placeholder="Return ID" id="returnId" required>

            <select class="form-select mb-2" id="category" required>
              <option value="">Select Category</option>
              <option>Electronics</option>
              <option>Clothing</option>
              <option>Accessories</option>
            </select>

            <textarea class="form-control mb-2" placeholder="Return Reason" id="reason" required></textarea>

            <label>Order Date</label>
            <input type="date" class="form-control mb-2" id="orderDate" required>

            <label>Return Date</label>
            <input type="date" class="form-control mb-3" id="returnDate" required>

            <button class="btn btn-primary w-100">Submit</button>
          </form>

          <div id="msg" class="mt-3 fw-bold text-center"></div>
        </div>
      </div>

    </div>
  </div>
</div>
