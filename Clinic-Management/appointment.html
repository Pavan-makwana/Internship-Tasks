<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Appointments</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body class="bg-light">

<div class="container mt-4">
  <h3 class="text-center mb-4">Appointment List</h3>

  <div class="table-responsive">
    <table class="table table-bordered align-middle text-center">
      <thead class="table-primary">
        <tr>
          <th>Name</th>
          <th>Doctor</th>
          <th>Date</th>
          <th>Time</th>
          <th>Status</th>
          <th>Update</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
async function loadAppointments() {
  const res = await fetch("http://localhost:5000/api/appointments");
  const data = await res.json();

  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";

  data.forEach(a => {
    tbody.innerHTML += `
      <tr>
        <td>${a.name}</td>
        <td>${a.doctor_name}</td>
        <td>${a.appointment_date}</td>
        <td>${a.appointment_time}</td>
        <td>
          <select class="form-select" id="status-${a.appointment_id}">
            <option ${a.status === "Pending" ? "selected" : ""}>Pending</option>
            <option ${a.status === "Confirmed" ? "selected" : ""}>Confirmed</option>
            <option ${a.status === "Cancelled" ? "selected" : ""}>Cancelled</option>
            <option ${a.status === "Completed" ? "selected" : ""}>Completed</option>
          </select>
        </td>
        <td>
          <button class="btn btn-success btn-sm"
            onclick="updateStatus(${a.appointment_id})">
            Update
          </button>
        </td>
      </tr>
    `;
  });
}

async function updateStatus(id) {
  const status = document.getElementById(`status-${id}`).value;

  await fetch(`http://localhost:5000/api/appointments/${id}/status`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status })
  });

  loadAppointments(); 
}

loadAppointments();
</script>

</body>
</html>
