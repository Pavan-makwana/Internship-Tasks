<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bill</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body class="bg-light">

<div class="container mt-4">

  <h3 class="text-center mb-4">Appointment Bill</h3>

  <!-- Bill -->
  <div id="billCard" class="card p-4 mx-auto d-none" style="max-width:600px">
    <h5 class="text-center mb-3">Clinic Invoice</h5>

    <p><strong>Patient Name:</strong> <span id="patient"></span></p>
    <p><strong>Doctor Name:</strong> <span id="doctor"></span></p>
    <p><strong>Specialization:</strong> <span id="spec"></span></p>
    <p><strong>Appointment Date:</strong> <span id="date"></span></p>
    <p><strong>Appointment Time:</strong> <span id="time"></span></p>

    <hr>

    <h5 class="text-end">Total Amount: ₹<span id="amount"></span></h5>
    <p class="text-muted text-end">
      Generated at: <span id="generated"></span>
    </p>
  </div>

  <div id="errorBox" class="alert alert-danger d-none text-center">
    Bill not found
  </div>

</div>

<script>
async function loadBill() {
  const params = new URLSearchParams(window.location.search);
  const appointmentId = params.get("aid");

  if (!appointmentId) {
    document.getElementById("errorBox").classList.remove("d-none");
    document.getElementById("errorBox").innerText =
      "Invalid bill link";
    return;
  }

  const res = await fetch(
    `http://localhost:5000/api/bill/${appointmentId}`
  );
  const data = await res.json();

  if (!res.ok) {
    document.getElementById("errorBox").classList.remove("d-none");
    return;
  }

  document.getElementById("patient").innerText = data.patient_name;
  document.getElementById("doctor").innerText = data.doctor_name;
  document.getElementById("spec").innerText = data.specialization;
  document.getElementById("date").innerText = data.appointment_date;
  document.getElementById("time").innerText = data.appointment_time;
  document.getElementById("amount").innerText = data.total_amount;
  document.getElementById("generated").innerText = data.generated_at;

  document.getElementById("billCard").classList.remove("d-none");
}

// Auto-load on page open
loadBill();
</script>

</body>
</html>
