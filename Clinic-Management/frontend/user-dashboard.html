<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary">
  <div class="container-fluid">
    <span class="navbar-brand">Clinic Management System</span>
    <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<!-- Dashboard -->
<div class="container mt-4">

  <div class="card p-4 mb-4">
    <h5>Welcome 👋</h5>
    <p class="mb-0">
      Logged in as: <strong id="phone"></strong>
    </p>
  </div>

  <div class="row text-center">

    <div class="col-md-6 mb-3">
      <div class="card p-4 h-100">
        <h5>Book Appointment</h5>
        <p class="text-muted">Schedule a new appointment with a doctor</p>
        <button class="btn btn-primary" onclick="goBooking()">
          Book Now
        </button>
      </div>
    </div>

    <div class="col-md-6 mb-3">
      <div class="card p-4 h-100">
        <h5>My Appointments</h5>
        <p class="text-muted">View appointment status and bills</p>
        <button class="btn btn-success" onclick="goAppointments()">
          View Appointments
        </button>
      </div>
    </div>

  </div>
</div>

<script>
// Show logged-in user
const phone = localStorage.getItem("userPhone");

if (!phone) {
  // If user directly opens dashboard without login
  window.location.href = "patient-login.html";
}

document.getElementById("phone").innerText = phone;

// Navigation
function goBooking() {
  window.location.href = "booking.html";
}

function goAppointments() {
  window.location.href = "my-appointments.html";
}

// Logout
function logout() {
  localStorage.removeItem("userPhone");
  window.location.href = "index.html";
}
</script>

</body>
</html>
